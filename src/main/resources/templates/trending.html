<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Movies</title>
</head>
<body>
<h1>Trending Movies</h1>

<!-- Display a message if no movies are available -->
<div th:if="${message}">
  <p th:text="${message}"></p>
</div>

<!-- Display the list of movies -->
<div th:if="${movies}">
  <ul>
    <li th:each="movie : ${movies}">
      <h2 th:text="${movie.title}"></h2>
      <img th:src="@{https://image.tmdb.org/t/p/w500/{posterPath}}" th:alt="Movie Poster" th:if="${movie.posterPath}" />
      <p th:text="${movie.overview}"></p>
      <a th:href="@{/movie/{id}(id=${movie.id})}">View Details</a>
      <button>Add to Favorites</button>
    </li>
  </ul>
</div>
</body>
</html>
