<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Details</title>
</head>
<body>
<h1 th:text="${movie.title}"></h1>
<img th:src="'https://image.tmdb.org/t/p/w500/' + ${movie.posterPath}" alt="Movie Poster">
<p th:text="${movie.overview}"></p>
<p><strong>Release Date:</strong> <span th:text="${movie.releaseDate}"></span></p>
<p><strong>Rating:</strong> <span th:text="${movie.rating}"></span></p>

<a href="/movies">Back to Movie List</a>
</body>
</html>
